   and the songs) or "artists"; the page the reader is in is marked. #}

  <a href="{{ site.artists_path }}"{% if nav_section == "artists" %} aria-current="true"{% endif %}>Interpreti</a>
  <a href="/">Ke stažení</a>
</nav>
